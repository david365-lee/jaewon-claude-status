<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Transparent background: a usage gauge ring with rising bars, readable on light and dark themes. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="50" fill="none" stroke="#94a3b8" stroke-opacity="0.35" stroke-width="12"/>
  <circle cx="64" cy="64" r="50" fill="none" stroke="url(#ring)" stroke-width="12" stroke-linecap="round"
          stroke-dasharray="226 314" transform="rotate(-90 64 64)"/>
  <rect x="40" y="70" width="12" height="20" rx="4" fill="url(#bar)"/>
  <rect x="58" y="56" width="12" height="34" rx="4" fill="url(#bar)"/>
  <rect x="76" y="42" width="12" height="48" rx="4" fill="url(#bar)"/>
</svg>

